<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101216"/>
      <stop offset="100%" stop-color="#0A0B0E"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16191F"/>
      <stop offset="100%" stop-color="#0D0E12"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- browser chrome -->
  <rect x="0" y="0" width="1200" height="44" fill="#16191F"/>
  <circle cx="24" cy="22" r="6" fill="#3EC6FF" opacity="0.35"/>
  <circle cx="46" cy="22" r="6" fill="#3EC6FF" opacity="0.35"/>
  <circle cx="68" cy="22" r="6" fill="#3EC6FF" opacity="0.35"/>
  <rect x="110" y="12" width="520" height="20" rx="10" fill="#0A0B0E"/>
  <text x="130" y="27" font-family="Inter, sans-serif" font-size="12" fill="#9AA1AC">locandacamilla.it</text>
  <!-- hero image block -->
  <rect x="0" y="44" width="1200" height="420" fill="url(#hero)"/>
  <text x="80" y="230" font-family="'Space Grotesk', sans-serif" font-size="46" font-weight="600" fill="#F5F6F7">Locanda Camilla</text>
  <text x="80" y="270" font-family="Inter, sans-serif" font-size="18" fill="#9AA1AC">Ospitalita&#768; su misura</text>
  <rect x="80" y="310" width="160" height="44" rx="22" fill="#3EC6FF"/>
  <text x="112" y="338" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0A0B0E">Prenota</text>
  <!-- content rows below the fold -->
  <g opacity="0.9">
    <rect x="80" y="500" width="320" height="180" rx="12" fill="#16191F" stroke="#3EC6FF" stroke-opacity="0.2"/>
    <rect x="440" y="500" width="320" height="180" rx="12" fill="#16191F" stroke="#3EC6FF" stroke-opacity="0.2"/>
    <rect x="800" y="500" width="320" height="180" rx="12" fill="#16191F" stroke="#3EC6FF" stroke-opacity="0.2"/>
  </g>
  <text x="600" y="770" font-family="Inter, sans-serif" font-size="12" fill="#9AA1AC" text-anchor="middle">Anteprima stilizzata del sito — sostituire con lo screenshot reale</text>
</svg>
